name: Build VM Bundle

# 构建 VM 底座：裁剪内核 + Alpine/Podman rootfs
# 产物上传为 artifact，并发布到 Release（打 tag 时）

on:
  push:
    branches: [main, master]
    paths:
      - 'build-kernel/**'
      - 'build-rootfs/**'
      - 'build-qemu/**'
      - '.github/workflows/build-bundle.yml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-rootfs:
    name: Rootfs (Alpine + Podman)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static squashfs-tools

      - name: Build rootfs
        working-directory: build-rootfs
        run: bash build-rootfs.sh

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: build-rootfs/out/rootfs.squashfs
          retention-days: 30

  build-kernel:
    name: Kernel (arm64 tinyconfig)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu flex bison bc libssl-dev libelf-dev

      - name: Build kernel
        working-directory: build-kernel
        run: bash build-kernel.sh

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: build-kernel/out/Image
          retention-days: 30

  build-qemu:
    name: QEMU (arm64, NDK)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK (r27)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(find "$SDK_ROOT" -name sdkmanager -type f | head -1)
          echo "using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "ndk;27.0.12077973"
          NDK="$SDK_ROOT/ndk/27.0.12077973"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" \
            && echo "NDK clang OK" || { echo "NDK clang missing"; ls "$NDK/toolchains/llvm/prebuilt/"*; exit 1; }

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build pkg-config libglib2.0-dev libpixman-1-dev python3-venv

      - name: Build QEMU
        working-directory: build-qemu
        run: bash build-qemu.sh

      - name: Upload qemu artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu
          path: build-qemu/out/qemu-system-aarch64
          retention-days: 30

  release:
    name: Attach bundle to release
    needs: [build-rootfs, build-kernel, build-qemu]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: bundle

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bundle/Image
            bundle/rootfs.squashfs
            bundle/qemu-system-aarch64
