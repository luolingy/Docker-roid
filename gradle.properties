# Gradle
# 内存预算：本机 7.9 GB，同时要跑 IDE / WSL 等。
# gradle(2.5G) + kotlin daemon(1.5G) ≈ 4G，是 R8 能稳定跑完的上限；
# 之前 -Xmx4096m + 2048m 曾把物理内存吃光导致 daemon 中途被杀。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# 单测执行器稳定性（JDK21 下 gradle test executor 崩溃的常见绕行）
org.gradle.daemon=false
kotlin.daemon.jvmargs=-Xmx1536m
